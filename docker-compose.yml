services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: espergen
      POSTGRES_USER: espergen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-espergen_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espergen"]
      interval: 5s
      timeout: 5s
      retries: 5

  espergen:
    image: incredibad/espergen:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://espergen:${POSTGRES_PASSWORD:-espergen_secret}@postgres:5432/espergen
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7283:7283"

volumes:
  postgres_data:
