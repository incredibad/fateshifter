services:
  fateshifter:
    image: incredibad/fateshifter:latest
    container_name: fateshifter
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-in-production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fateshifter_secret}
    ports:
      - "7283:7283"
    volumes:
      - fateshifter_data:/var/lib/postgresql/data

volumes:
  fateshifter_data:
